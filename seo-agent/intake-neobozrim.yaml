domain: neobozrim.com
description: |
  Авторски театър (author theatre) by Neobozrim — individual author-actor creating
  моноспектакли (solo performances) using spoken word poetry as the theatrical language.
  A new genre for the Bulgarian market: original poetry performed as theatre, not
  recited readings of others' work. Based in Sofia, Bulgaria.

  Neobozrim writes his own poetry and performs it as theatre — combining spoken word,
  physical theatre, and monologue into a unique solo performance format. He has won
  3 awards from Festival of Author Theatre and 1 award for Best Performance in Sofia
  from Alma Alter Theatre. His second play is launching soon.

  Key differentiator: this is NOT actors reading poetry on stage. This is an author
  who writes original spoken word poetry and uses it as the language for theatrical
  performance — a completely new genre in Bulgaria.

goal: |
  Build strong online presence for Neobozrim as an author-actor in the Bulgarian
  theatre scene. Position him as a pioneer of spoken word poetry theatre in Bulgaria.
  Drive ticket sales and audience discovery through SEO and content marketing.
  Prepare for social media expansion with AI-generated video content.

