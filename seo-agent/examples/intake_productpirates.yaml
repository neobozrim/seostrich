domain: productpirates.club

description: |
  Product Pirates Club is an AI Product Management Community of
  Practice based in Sofia, Bulgaria. We run events, workshops, and
  peer learning groups for product managers integrating AI/LLM
  features — prompt engineering, agent design, evals, GTM for AI
  products, governance. Members are senior PMs at tech companies and
  AI-native startups in Central and Eastern Europe.

