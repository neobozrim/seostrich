[project]
name = "seo-agent"
version = "0.1.0"
description = "Versatile SEO agent with tool-based workflow — keyword research, content strategy, technical audit, competitor analysis, IndexNow, and Bing Webmaster Tools"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30",
    "httpx>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "lxml>=5.0",
    "google-auth>=2.0",
]

[project.scripts]
seo-agent = "src.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
